# بناء نسخة APK (debug) لتطبيق جاد ثيرم — يعمل تلقائيًا على GitHub
# الناتج: ملف app-debug.apk جاهز للتوزيع الداخلي على الفريق
# (واتساب / درايف / Firebase App Distribution) بدون المرور بمتجر.
# نسخة debug لا تحتاج مفتاح توقيع، وتصلح للتجربة والتوزيع الداخلي فقط.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "public/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets
        run: |
          cp ../public/index.html ../public/app.js ../public/style.css ../public/icon.svg www/
          cp ../public/icon-512.png ../public/icon-192.png ../public/manifest.json ../public/sw.js www/ 2>/dev/null || true
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jad-therm-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
