# بناء نسخة APK (debug) لتطبيق جاد ثيرم — يعمل تلقائيًا على GitHub
# الناتج: ملف app-debug.apk جاهز للتوزيع الداخلي على الفريق
# (واتساب / درايف / Firebase App Distribution) بدون المرور بمتجر.
# نسخة debug لا تحتاج مفتاح توقيع، وتصلح للتجربة والتوزيع الداخلي فقط.
name: Build Android APK

# The failure reporter creates an issue, so the token needs issues:write.
permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "public/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets
        run: |
          cp ../public/index.html ../public/app.js ../public/style.css ../public/icon.svg www/
          cp ../public/icon-512.png ../public/icon-192.png ../public/manifest.json ../public/sw.js www/ 2>/dev/null || true
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted runners already ship the full Android SDK (root-owned at
      # /usr/local/lib/android/sdk). android-actions/setup-android@v3 fails on
      # it (permission errors reinstalling over the preinstalled SDK), so use
      # the preinstalled one directly instead.
      - name: Use runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-apk.log"
          test "${PIPESTATUS[0]}" -eq 0

      # Temporary debug aid: post the Gradle error tail as an issue so the
      # failure can be read without GitHub log access. Remove once green.
      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-apk.log"
          {
            echo "=== javac errors ==="
            grep -n "error:" "$LOG" | head -40
            echo "=== What went wrong ==="
            grep -A 12 "What went wrong" "$LOG" | head -30
            echo "=== Caused by ==="
            grep "Caused by" "$LOG" | head -10
            echo "=== tail ==="
            tail -n 40 "$LOG"
          } > /tmp/report.txt
          BODY="APK build failed on $GITHUB_SHA.
          $(cat /tmp/report.txt)"
          jq -n --arg title "[CI debug] APK build failed" --arg body "$BODY" '{title:$title, body:$body}' > /tmp/issue.json
          curl -sS -f -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d @/tmp/issue.json "https://api.github.com/repos/$GITHUB_REPOSITORY/issues"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jad-therm-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
