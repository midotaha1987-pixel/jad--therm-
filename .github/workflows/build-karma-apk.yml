# بناء نسخة APK (debug) للعبة "عالم كارما الجميلة وأخواتها" — يعمل تلقائيًا على GitHub
# الناتج: ملف app-debug.apk جاهز للتثبيت على أندرويد مباشرة.
# اللعبة محلية بالكامل (لا تحتاج إنترنت): ملف HTML واحد + ملفات تلاوة MP3.
# نسخة debug لا تحتاج مفتاح توقيع، وتصلح للتوزيع الداخلي فقط.
name: Build Karma Game APK

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "karma-game/**"
      - ".github/workflows/build-karma-apk.yml"
  workflow_dispatch:

jobs:
  build-karma-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: karma-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: karma-game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets
        run: npx cap sync android

      # Capacitor 7.6's android library sets source/targetCompatibility to
      # Java 21 — JDK 17 fails its compile with "invalid source release: 21".
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub-hosted runners already ship the full Android SDK (root-owned at
      # /usr/local/lib/android/sdk). android-actions/setup-android@v3 fails on
      # it (permission errors reinstalling over the preinstalled SDK), so use
      # the preinstalled one directly instead.
      - name: Use runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-karma-apk.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karma-game-apk
          path: karma-game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
