; Export presets for مغامرات عمر وياسين 3D (Godot 4.4).
; Android APK, debug-signed. The debug keystore is NOT committed:
; CI generates godot-game/debug.keystore (alias "android", store/key
; password "android") before running the export. For a local export,
; generate it yourself with:
;   keytool -genkeypair -keystore debug.keystore -storepass android \
;     -alias android -keypass android -keyalg RSA -keysize 2048 \
;     -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
; A release keystore is still needed later for Google Play.

